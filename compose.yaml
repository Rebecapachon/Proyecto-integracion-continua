services:
  inventario:
    build: .
    image: entrega1-pedidos-compose
    command: ["python", "app/inventario.py"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  pedidos:
    build: .
    image: entrega1-pedidos-compose
    command: ["python", "app/pedido_remoto.py", "examples/pedido.json"]
    environment:
      INVENTARIO_URL: http://inventario:8000/existencias
    depends_on:
      inventario:
        condition: service_healthy
